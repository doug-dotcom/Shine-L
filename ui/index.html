<!DOCTYPE html>
<html>
<head>
    <title>Shine L</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .chat-box {
            border: 1px solid #444;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            background: #020617;
            border-radius: 10px;
        }

        .input-row {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            background: #22c55e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Shine L</h2>

    <div class="chat-box" id="chat"></div>

    <div class="input-row">
        <input id="input" placeholder="Talk to L..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const message = input.value;

    if (!message) return;

    addMessage("You", message);

    const res = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: message
        })
    });

    const data = await res.json();

    addMessage("L", data.reply);

    input.value = "";
}

function addMessage(sender, text) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.innerHTML = "<b>" + sender + ":</b> " + text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
